name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/screenshots/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on Wear OS emulator (API 28, large round 454x454)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: android-wear
          arch: x86
          profile: wearos_large_round
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/screenshots/capture.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-screenshots
          path: shots/

      - name: Publish to screenshots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          mkdir /tmp/sb && cp shots/*.png /tmp/sb/ && cd /tmp/sb
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
